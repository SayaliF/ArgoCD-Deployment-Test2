apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ui
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: nginx-ui
  template:
    metadata:
      labels:
        app: nginx-ui
    spec:
      containers:
        - name: nginx-ui
          image: public.ecr.aws/nginx/nginx:mainline-alpine3.24-otel
          ports:
            - containerPort: 80
